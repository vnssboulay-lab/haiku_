<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#e8f2ed">
	<title>Birds Punctuate the Days | Joyce Clement</title>
	<style>
		:root {
			color-scheme: light;
			--paper: #e8f2ed;
			--ink: #183c34;
			--muted: #54736a;
			--accent: #c45d43;
			--rule: #b9d0c5;
		}

		* {
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			margin: 0;
			color: var(--ink);
			background-color: var(--paper);
			background-image: repeating-linear-gradient(
				0deg,
				transparent 0,
				transparent 39px,
				rgb(24 60 52 / 4%) 40px
			);
			font-family: "Century Gothic", "Trebuchet MS", sans-serif;
		}

		main {
			width: min(100% - 40px, 760px);
			margin-inline: auto;
			padding: clamp(48px, 9vw, 100px) 0 56px;
			animation: appear 700ms ease-out both;
		}

		header {
			padding-bottom: 26px;
			border-bottom: 1px solid var(--rule);
		}

		.eyebrow {
			margin: 0 0 14px;
			color: var(--accent);
			font-size: 0.72rem;
			font-weight: 700;
			text-transform: uppercase;
			letter-spacing: 0.16em;
		}

		h1 {
			max-width: 620px;
			margin: 0;
			font-family: Georgia, "Times New Roman", serif;
			font-size: clamp(2.5rem, 8vw, 5rem);
			font-weight: 400;
			line-height: 1.02;
		}

		.byline {
			margin: 18px 0 0;
			color: var(--muted);
			font-size: 0.96rem;
		}

		.poem {
			padding: clamp(38px, 7vw, 64px) 0 clamp(42px, 8vw, 72px);
			font-family: Georgia, "Times New Roman", serif;
			font-size: clamp(1.35rem, 4vw, 2rem);
			line-height: 1.55;
			text-align: center;
		}

		.poem p {
			margin: 0;
		}

		.poem p + p {
			margin-top: 0.55em;
		}

		figure {
			margin: 0;
		}

		figure img {
			display: block;
			width: 100%;
			height: auto;
			border: 1px solid rgb(24 60 52 / 12%);
		}

		figcaption {
			margin-top: 12px;
			color: var(--muted);
			font-size: 0.78rem;
			text-align: right;
		}

		@keyframes appear {
			from { opacity: 0; transform: translateY(10px); }
			to { opacity: 1; transform: translateY(0); }
		}

		@media (prefers-reduced-motion: reduce) {
			main { animation: none; }
		}
	</style>
</head>
<body>
	<main>
		<header>
			<p class="eyebrow">A haiku</p>
			<h1>Birds Punctuate the Days</h1>
			<p class="byline">by Joyce Clement</p>
		</header>

		<section class="poem" aria-label="Haiku">
			<p>Period</p>
			<p>One blue egg all summer long</p>
			<p>Now Gone</p>
		</section>

		<figure>
			<img src="img/Haiku_image.jpg" alt="Image accompanying the haiku Birds Punctuate the Days">
			<figcaption>Birds Punctuate the Days</figcaption>
		</figure>
	</main>
</body>
</html>
